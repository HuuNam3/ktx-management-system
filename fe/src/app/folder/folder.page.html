<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button color="primary"></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ folder }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container" class="text-center absolute inset-x-0 top-1/2 -translate-y-1/2">
    <strong class="capitalize text-xl leading-[26px]">{{ folder }}</strong>
    <p class="text-base leading-[22px] text-[#8c8c8c] m-0">Explore <a target="_blank" rel="noopener noreferrer" href="https://ionicframework.com/docs/components" class="no-underline">UI Components</a></p>
  </div>
</ion-content>
