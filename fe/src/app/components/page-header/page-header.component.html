<div class="flex items-center justify-between mb-7 flex-wrap gap-4">
  <div>
    <h1 class="text-[36px] font-black text-text-primary m-0 leading-tight">{{ title() }}</h1>
    @if (description()) {
      <p class="text-[18px] text-text-secondary mt-2">{{ description() }}</p>
    }
  </div>
  <div class="flex flex-wrap justify-end gap-3">
    @if (showCheckin()) {
      <button class="app-action-button border-none bg-success text-[16px] font-bold text-white cursor-pointer transition-all duration-200 hover:bg-[#15803D] active:scale-95" (click)="checkinClick.emit()">
        <app-lucide-icon name="plus" [size]="18" color="white" />
        Check-in
      </button>
    }
    @if (showCheckout()) {
      <button class="app-action-button border-none bg-danger text-[16px] font-bold text-white cursor-pointer transition-all duration-200 hover:bg-[#B91C1C] active:scale-95" (click)="checkoutClick.emit()">
        <app-lucide-icon name="arrow-right" [size]="18" color="white" />
        Check-out
      </button>
    }
    @if (showQR()) {
      <button class="app-action-button border-none bg-primary text-[16px] font-bold text-white cursor-pointer transition-all duration-200 hover:bg-[#1D4ED8] active:scale-95" (click)="qrClick.emit()">
        <app-lucide-icon name="qr-code" [size]="18" color="white" />
        Quét QR
      </button>
    }
    <ng-content />
  </div>
</div>
