<div class="bg-card-bg rounded-xl p-6 border border-border">
  <div class="flex justify-between items-start mb-5">
    <div>
      <h3 class="text-xl font-semibold text-text-primary m-0">{{ title() }}</h3>
      @if (description()) {
        <p class="text-sm text-text-secondary mt-1 m-0">{{ description() }}</p>
      }
    </div>
  </div>
  <div>
    @if (type() === 'line') {
      <svg class="w-full h-auto" [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight" preserveAspectRatio="xMidYMid meet">
        @for (line of gridLines(); track $index) {
          <line
            [attr.x1]="padLeft" [attr.y1]="line.y"
            [attr.x2]="padLeft + chartW()" [attr.y2]="line.y"
            stroke="#D1D5DB" stroke-dasharray="4,4" stroke-width="1"
          />
          <text [attr.x]="padLeft - 5" [attr.y]="line.y + 4" text-anchor="end" class="text-[9px]" fill="#9CA3AF">{{ line.label }}</text>
          <text [attr.x]="padLeft + chartW() + 5" [attr.y]="line.y + 4" text-anchor="start" class="text-[9px]" fill="#9CA3AF">{{ line.label }}</text>
        }
        <polyline
          [attr.points]="linePoints()"
          fill="none"
          stroke="var(--color-success)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <polygon
          [attr.points]="areaPoints()"
          fill="url(#areaGrad)"
          opacity="0.25"
        />
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--color-primary)" />
            <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
          </linearGradient>
        </defs>
        @for (pt of linePoints().split(' '); track $index) {
          @if (pt) {
            <circle [attr.cx]="pt.split(',')[0]" [attr.cy]="pt.split(',')[1]" r="3" fill="var(--color-success)" stroke="white" stroke-width="1.5" />
          }
        }
      </svg>
      <div class="flex justify-between mt-3 text-xs text-text-secondary">
        @for (label of labels(); track label) {
          <span>{{ label }}</span>
        }
      </div>
    }
    @if (type() === 'donut') {
      <div class="relative w-40 mx-auto mb-5">
        <svg viewBox="0 0 42 42" class="w-full h-auto">
          @for (seg of donutSegments(); track $index) {
            <circle
              cx="21" cy="21" r="15.9"
              fill="none"
              [attr.stroke]="seg.color"
              stroke-width="3"
              [attr.stroke-dasharray]="seg.dash"
              stroke-dashoffset="0"
              [attr.transform]="'rotate(' + seg.offset + ' 21 21)'"
            />
          }
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="text-2xl font-bold text-text-primary">{{ totalValue() }}</span>
        </div>
      </div>
      <div class="flex flex-col gap-2.5">
        @for (item of legendItems(); track $index) {
          <div class="flex items-center gap-2.5 text-sm">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" [style.background]="item.color"></span>
            <span class="flex-1 text-text-secondary">{{ item.label }}</span>
            <span class="font-semibold text-text-primary">{{ item.value }}</span>
          </div>
        }
      </div>
      <div class="flex justify-end mt-4">
        <button class="app-action-button-sm text-sm font-medium text-white bg-[#111827] border border-[#374151] cursor-pointer transition-all duration-200 hover:bg-[#1f2937] active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Xuất báo cáo
        </button>
      </div>
    }
  </div>
</div>
