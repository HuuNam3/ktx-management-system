<div class="flex items-center gap-5 rounded-xl bg-[#F8FAFC] px-5 py-4">
  <div class="w-12 h-12 rounded-full bg-[#DCFCE7] flex items-center justify-center shrink-0 text-[#00A63E]">
    <app-lucide-icon name="user-plus" [size]="24" color="#00A63E" />
  </div>
  <div class="flex-1 min-w-0">
    <span class="text-[20px] font-black text-text-primary block mb-1">{{ item().name }}</span>
    <div class="text-[16px] text-text-secondary">
      <span>CCCD: {{ item().cccd }}</span>
    </div>
  </div>
  <div class="grid grid-cols-[140px_90px_75px] gap-5 items-center text-right shrink-0">
    <div>
      <div class="text-[16px] text-text-secondary">Phòng - Giường</div>
      <div class="text-[20px] font-black text-black">{{ item().room }} - {{ item().bed }}</div>
    </div>
    <div>
      <div class="text-[16px] text-text-secondary">Loại</div>
      <app-status-tag [type]="item().type" />
    </div>
    <div>
      <div class="text-[16px] text-text-secondary">Thời gian</div>
      <div class="text-[18px] font-black text-black">{{ item().time }}</div>
    </div>
  </div>
</div>
