<div class="flex items-center gap-4 py-4 [&+&]:border-t [&+&]:border-border">
  <div class="w-11 h-11 rounded-xl bg-primary-light flex items-center justify-center shrink-0 [&_ion-icon]:text-2xl [&_ion-icon]:text-primary">
    <ion-icon name="person-outline"></ion-icon>
  </div>
  <div class="flex-1 min-w-0">
    <span class="text-[15px] font-semibold text-text-primary block mb-1">{{ item().name }}</span>
    <div class="flex items-center gap-1.5 text-[13px] text-text-secondary flex-wrap">
      <span>CCCD: {{ item().cccd }}</span>
      <span class="text-border">·</span>
      <span>Phòng {{ item().room }}</span>
      <span class="text-border">·</span>
      <span>Giường {{ item().bed }}</span>
    </div>
  </div>
  <div class="flex flex-col items-end gap-1.5 shrink-0">
    <app-status-tag [type]="item().type" />
    <span class="text-[12px] text-text-secondary">{{ item().time }}</span>
  </div>
</div>
