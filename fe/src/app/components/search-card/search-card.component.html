<div class="bg-card-bg rounded-[20px] p-6 border border-border h-full">
  <h3 class="text-xl font-semibold text-text-primary mt-0 mb-2">Tìm kiếm</h3>
  <p class="text-sm text-text-secondary mt-0 mb-5 leading-relaxed">Tìm kiếm sinh viên, khách hoặc nhân viên theo CCCD, tên hoặc số phòng</p>
  <div class="relative">
    <ion-icon name="search-outline" class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-text-secondary pointer-events-none"></ion-icon>
    <input
      type="text"
      class="w-full py-[14px] pl-12 pr-4 border border-border rounded-xl text-[15px] outline-none bg-bg text-text-primary transition-colors duration-200 placeholder:text-gray-400 focus:border-primary focus:ring-3 focus:ring-primary/10"
      placeholder="Nhập CCCD, tên hoặc số phòng..."
      [value]="lastQuery()"
      (input)="onInput($any($event.target).value)"
    />
  </div>
</div>
