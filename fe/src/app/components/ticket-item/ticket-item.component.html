<div class="ticket-item">
  <div class="ticket-icon" [style.background]="iconBg">
    <app-lucide-icon [name]="icon" [size]="22" [color]="item().type === 'meal' ? '#16A34A' : '#2563EB'" />
  </div>
  <div class="ticket-info">
    <span class="ticket-name">{{ item().name }}</span>
    <span class="ticket-desc">{{ item().description }}</span>
    <span class="ticket-time">{{ item().time }}</span>
  </div>
  <div class="ticket-amount">{{ formattedAmount }}</div>
</div>
