<div class="inline-flex gap-1 flex-wrap bg-[#E5E7EB] p-1 rounded-2xl">
  @for (opt of options(); track opt.value) {
    <button
      class="px-4 py-2 rounded-xl border-0 bg-transparent text-black text-[18px] font-bold cursor-pointer transition-all duration-200 hover:bg-white/70"
      [class.bg-white]="selected() === opt.value"
      [class.shadow-sm]="selected() === opt.value"
      (click)="select(opt.value)"
    >
      {{ opt.label }}
    </button>
  }
</div>
