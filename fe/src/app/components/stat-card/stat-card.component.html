<div class="bg-card-bg rounded-[16px] p-5 border border-border flex items-center justify-between h-full min-h-[116px] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg" [style.--stat-color]="color()" [style.--stat-bg]="bgColor()">
  <div class="flex flex-col gap-2">
    <span class="text-sm text-text-secondary font-medium">{{ label() }}</span>
    <span class="text-[34px] font-bold text-text-primary leading-none">{{ value() }}</span>
  </div>
  <div class="size-14 rounded-2xl bg-[var(--stat-bg)] flex items-center justify-center shrink-0">
    @if (lucideIcon()) {
      <app-lucide-icon [name]="lucideIcon()" [size]="28" [color]="color()" />
    } @else {
      <span class="text-[28px] text-[var(--stat-color)]">{{ icon() }}</span>
    }
  </div>
</div>
