<div class="bg-card-bg rounded-xl p-6 border border-border">
  <h3 class="text-xl font-semibold text-text-primary m-0 mb-5">{{ title() }}</h3>
  <div class="flex flex-col gap-0">
    @for (item of items(); track item.id) {
      <div class="flex gap-4 py-4 relative not-first:before:content-[''] not-first:before:absolute not-first:before:left-[7px] not-first:before:top-0 not-first:before:w-0.5 not-first:before:h-full not-first:before:bg-border last:pb-0">
        <div class="w-4 h-4 rounded-full shrink-0 mt-1 z-[1]"
             [class.bg-success]="item.type === 'checkin'"
             [class.bg-danger]="item.type === 'checkout'"
             [class.bg-primary]="item.type === 'payment'"
             [class.bg-warning]="item.type === 'register'"></div>
        <div class="flex flex-col gap-1 flex-1">
          <div class="flex items-center gap-2.5">
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded"
                  [class.bg-[#F0FDF4]]="item.type === 'checkin'"
                  [class.text-success]="item.type === 'checkin'"
                  [class.bg-[#FEF2F2]]="item.type === 'checkout'"
                  [class.text-danger]="item.type === 'checkout'"
                  [class.bg-primary-light]="item.type === 'payment'"
                  [class.text-primary]="item.type === 'payment'"
                  [class.bg-[#FFF7ED]]="item.type === 'register'"
                  [class.text-warning]="item.type === 'register'">{{ getTypeLabel(item.type) }}</span>
            <span class="text-xs text-text-secondary">{{ item.time }}</span>
          </div>
          <span class="text-[15px] font-semibold text-text-primary">{{ item.title }}</span>
          <span class="text-[13px] text-text-secondary">{{ item.description }}</span>
        </div>
      </div>
    }
  </div>
</div>
