<div class="bg-card-bg rounded-lg p-6 border border-border">
  <div class="flex items-center justify-between mb-2">
    <h3 class="text-xl font-semibold text-text-primary m-0">Check-in gần đây</h3>
    <button class="bg-transparent border-0 text-primary text-sm font-medium cursor-pointer px-2 py-1 rounded-md hover:bg-primary-light">Xem tất cả →</button>
  </div>
  <div class="flex flex-col">
    @for (item of items(); track item.cccd) {
      <app-recent-checkin-item [item]="item" />
    }
  </div>
</div>
