<ion-app>
  @if (auth.isLoggedIn()) {
    <div class="h-screen overflow-hidden">
      <app-sidebar></app-sidebar>
      <div
        class="fixed bottom-0 right-0 top-0 min-w-0 overflow-hidden"
        [style.left]="'var(--sidebar-width)'"
        [style.width]="'calc(100% - var(--sidebar-width))'"
        [style.transition]="'left 0.3s ease, width 0.3s ease'"
      >
        <app-topbar></app-topbar>
        <main
          class="absolute bottom-0 left-0 right-0 min-w-0 overflow-x-hidden overflow-y-auto"
          [style.top]="'var(--topbar-height)'"
          [style.background]="'var(--bg)'"
        >
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  } @else {
    <router-outlet></router-outlet>
  }
</ion-app>
