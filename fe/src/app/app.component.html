<ion-app>
  <div class="flex min-h-screen">
    <app-sidebar></app-sidebar>
    <div class="flex-1 flex flex-col min-h-screen" [style.marginLeft]="'var(--sidebar-width)'">
      <app-topbar></app-topbar>
      <div class="flex-1 overflow-y-auto" [style.marginTop]="'var(--topbar-height)'" [style.background]="'var(--bg)'" [style.height]="'calc(100vh - var(--topbar-height))'">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ion-app>
