<div class="page">
  <app-page-header
    title="Quản lý vé"
    description="Quản lý vé ăn và vé xe"
    [showCheckin]="false"
    [showCheckout]="false"
    [showQR]="true"
    (qrClick)="onQr()"
  >
    <button class="inline-flex items-center gap-2 px-6 py-3 rounded-xl text-[15px] font-semibold border-none cursor-pointer bg-primary text-white hover:bg-[#1D4ED8]" (click)="onBuy()"><app-lucide-icon name="plus" [size]="18" color="white" /> Mua vé mới</button>
  </app-page-header>

  @if (stats) {
    <div class="row stats-row stats-row-4">
      <app-statistic-card label="Vé ăn" [value]="stats.mealTickets | number" lucideIcon="utensils-crossed" subtitle="Hôm nay" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Vé xe" [value]="stats.vehicleTickets | number" lucideIcon="car" subtitle="Hôm nay" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Doanh thu" [value]="formatCurrency(stats.revenue)" lucideIcon="dollar-sign" subtitle="Tháng 7/2026" color="#F59E0B" bgColor="#FFFBEB" />
      <app-statistic-card label="Suất ăn" [value]="stats.mealsServed | number" lucideIcon="utensils" subtitle="Đã phục vụ" color="#8B5CF6" bgColor="#F3E8FF" />
    </div>
  }

  <div class="row grid grid-cols-2 gap-6 max-lg:grid-cols-1">
    <div>
      <div class="bg-card-bg rounded-xl p-6 border border-border">
        <div class="flex items-center gap-2.5 mb-2">
          <h3 class="text-xl font-semibold text-text-primary m-0">Giao dịch vé ăn</h3>
          <span class="bg-bg text-text-secondary text-xs font-semibold px-2.5 py-0.5 rounded-full">{{ mealTransactions.length }}</span>
        </div>
        @for (item of mealTransactions; track item.id) {
          <app-ticket-item [item]="item" />
        }
      </div>
    </div>
    <div>
      <div class="bg-card-bg rounded-xl p-6 border border-border">
        <div class="flex items-center gap-2.5 mb-2">
          <h3 class="text-xl font-semibold text-text-primary m-0">Giao dịch vé xe</h3>
          <span class="bg-bg text-text-secondary text-xs font-semibold px-2.5 py-0.5 rounded-full">{{ vehicleTransactions.length }}</span>
        </div>
        @for (item of vehicleTransactions; track item.id) {
          <app-ticket-item [item]="item" />
        }
      </div>
    </div>
  </div>
</div>
