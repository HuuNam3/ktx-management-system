<div class="ticket-page">
  <app-page-header
    title="Quản lý vé"
    description="Quản lý vé ăn và vé xe"
    [showCheckin]="false"
    [showCheckout]="false"
    [showQR]="true"
    (qrClick)="onQr()"
  >
    <button class="btn btn-primary" (click)="onBuy()"><app-lucide-icon name="plus" [size]="18" color="white" /> Mua vé mới</button>
  </app-page-header>

  @if (stats) {
    <div class="row stats-row">
      <app-statistic-card label="Vé ăn" [value]="stats.mealTickets | number" lucideIcon="utensils-crossed" subtitle="Hôm nay" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Vé xe" [value]="stats.vehicleTickets | number" lucideIcon="car" subtitle="Hôm nay" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Doanh thu" [value]="formatCurrency(stats.revenue)" lucideIcon="dollar-sign" subtitle="Tháng 7/2026" color="#F59E0B" bgColor="#FFFBEB" />
      <app-statistic-card label="Suất ăn" [value]="stats.mealsServed | number" lucideIcon="utensils" subtitle="Đã phục vụ" color="#8B5CF6" bgColor="#F3E8FF" />
    </div>
  }

  <div class="row lists-row">
    <div class="col-list">
      <div class="list-card">
        <div class="list-card-header">
          <h3>Giao dịch vé ăn</h3>
          <span class="count-badge">{{ mealTransactions.length }}</span>
        </div>
        @for (item of mealTransactions; track item.id) {
          <app-ticket-item [item]="item" />
        }
      </div>
    </div>
    <div class="col-list">
      <div class="list-card">
        <div class="list-card-header">
          <h3>Giao dịch vé xe</h3>
          <span class="count-badge">{{ vehicleTransactions.length }}</span>
        </div>
        @for (item of vehicleTransactions; track item.id) {
          <app-ticket-item [item]="item" />
        }
      </div>
    </div>
  </div>
</div>
