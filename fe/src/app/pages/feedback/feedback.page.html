<div class="p-8 max-w-[1400px]">
  <app-page-header
    title="Phản hồi & Khiếu nại"
    description="Quản lý góp ý từ sinh viên"
    [showCheckin]="false" [showCheckout]="false" [showQR]="false"
  />

  @if (stats) {
    <div class="mb-6 grid gap-4 grid-cols-4">
      <app-statistic-card label="Chờ xử lý" [value]="stats.pending | number" lucideIcon="hourglass" subtitle="" color="#F59E0B" bgColor="#FFFBEB" />
      <app-statistic-card label="Đã xử lý" [value]="stats.resolved | number" lucideIcon="check-circle" subtitle="" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Ưu tiên cao" [value]="stats.highPriority | number" lucideIcon="circle-alert" subtitle="" color="#DC2626" bgColor="#FEF2F2" />
      <app-statistic-card label="Tổng phản hồi" [value]="stats.total | number" lucideIcon="bar-chart-3" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
    </div>
  }

  <div class="mb-6 bg-card-bg rounded-[20px] border border-border overflow-x-auto">
    <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-xs font-semibold text-text-secondary uppercase tracking-wider border-b border-border grid-cols-[1fr_70px_90px_1fr_90px_90px_100px_80px]">
      <span>Sinh viên</span>
      <span>Phòng</span>
      <span>Loại</span>
      <span>Nội dung</span>
      <span>Ngày gửi</span>
      <span>Mức độ</span>
      <span>Trạng thái</span>
      <span>Thao tác</span>
    </div>
    <div class="table-bdy">
      @for (f of feedbacks; track f.id) {
        <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-sm text-text-primary border-t border-[#F3F4F6] hover:bg-[#FAFBFC] grid-cols-[1fr_70px_90px_1fr_90px_90px_100px_80px]">
          <span class="font-semibold">{{ f.student }}</span>
          <span>{{ f.room }}</span>
          <span>{{ f.type }}</span>
          <span class="max-w-[220px] truncate">{{ f.content }}</span>
          <span>{{ f.date }}</span>
          <span><span class="badge" [class]="getPriorityBadge(f.priority)">{{ getPriorityLabel(f.priority) }}</span></span>
          <span><span class="badge" [class]="getStatusBadge(f.status)">{{ getStatusLabel(f.status) }}</span></span>
          <span>
            <button class="size-9 rounded-[10px] border-none bg-transparent cursor-pointer inline-flex items-center justify-center text-lg transition-colors duration-200 hover:bg-bg" title="Xem"><app-lucide-icon name="eye" [size]="18" /></button>
            @if (f.status === 'cho-xu-ly') {
              <button class="size-9 rounded-[10px] border-none bg-transparent cursor-pointer inline-flex items-center justify-center text-lg transition-colors duration-200 hover:bg-bg" title="Xử lý"><app-lucide-icon name="pencil" [size]="18" /></button>
            }
          </span>
        </div>
      }
    </div>
  </div>
</div>
