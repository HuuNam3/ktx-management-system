<div class="page">
  <app-page-header
    title="Quản lý phòng"
    description="Quản lý thông tin phòng ở"
    [showCheckin]="false"
    [showCheckout]="false"
    [showQR]="false"
  />

  @if (stats) {
    <div class="row stats-row grid-cols-5 max-lg:grid-cols-3 max-sm:grid-cols-2">
      <app-statistic-card label="Tổng phòng" [value]="stats.total | number" lucideIcon="building" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Còn trống" [value]="stats.empty | number" lucideIcon="check-circle" subtitle="" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Còn chỗ" [value]="stats.partial | number" lucideIcon="minus-circle" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Đầy" [value]="stats.full | number" lucideIcon="x-circle" subtitle="" color="#DC2626" bgColor="#FEF2F2" />
      <app-statistic-card label="Bảo trì" [value]="stats.maintenance | number" lucideIcon="settings" subtitle="" color="#F59E0B" bgColor="#FFFBEB" />
    </div>
  }

  <div class="row flex">
    <app-filter-bar
      [options]="filterOptions"
      [selected]="selectedBlock"
      (selectedChange)="onFilterChange($event)"
    />
  </div>

  <div class="row grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-5 max-sm:grid-cols-2">
    @for (room of rooms; track room.id) {
      <app-room-card [room]="room" />
    }
  </div>
</div>
