<div class="p-8 max-w-[1400px]">
  <app-page-header
    title="Nhật ký ra vào"
    description="Theo dõi lịch sử ra vào ký túc xá"
    [showCheckin]="false"
    [showCheckout]="false"
    [showQR]="false"
  />

  @if (stats) {
    <div class="grid grid-cols-4 gap-4 mb-6">
      <app-statistic-card label="Check-in hôm nay" [value]="stats.todayCheckins | number" lucideIcon="log-in" subtitle="" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Check-out hôm nay" [value]="stats.todayCheckouts | number" lucideIcon="log-out" subtitle="" color="#DC2626" bgColor="#FEF2F2" />
      <app-statistic-card label="Tổng lượt vào" [value]="stats.totalEntries | number" lucideIcon="door-open" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Tổng lượt ra" [value]="stats.totalExits | number" lucideIcon="footprints" subtitle="" color="#8B5CF6" bgColor="#F3E8FF" />
    </div>
  }

  <div class="flex justify-between items-center flex-wrap gap-4 mb-6">
    <div class="flex gap-2 flex-wrap">
      <button
        class="px-5 py-2 rounded-full border text-sm font-medium cursor-pointer transition-all duration-200"
        [ngClass]="filterType === 'all' ? 'bg-primary text-white border-primary' : 'bg-card-bg text-text-secondary border-border hover:border-primary hover:text-primary'"
        (click)="setFilter('all')">Tất cả</button>
      <button
        class="px-5 py-2 rounded-full border text-sm font-medium cursor-pointer transition-all duration-200"
        [ngClass]="filterType === 'checkin' ? 'bg-primary text-white border-primary' : 'bg-card-bg text-text-secondary border-border hover:border-primary hover:text-primary'"
        (click)="setFilter('checkin')">Check-in</button>
      <button
        class="px-5 py-2 rounded-full border text-sm font-medium cursor-pointer transition-all duration-200"
        [ngClass]="filterType === 'checkout' ? 'bg-primary text-white border-primary' : 'bg-card-bg text-text-secondary border-border hover:border-primary hover:text-primary'"
        (click)="setFilter('checkout')">Check-out</button>
      <button
        class="px-5 py-2 rounded-full border text-sm font-medium cursor-pointer transition-all duration-200"
        [ngClass]="filterType === 'qr' ? 'bg-primary text-white border-primary' : 'bg-card-bg text-text-secondary border-border hover:border-primary hover:text-primary'"
        (click)="setFilter('qr')">QR</button>
    </div>
    <div>
      <app-search-input placeholder="Tìm kiếm CCCD, tên, phòng..." (valueChange)="onSearch($event)" />
    </div>
  </div>

  <div class="bg-card-bg rounded-[20px] border border-border overflow-x-auto mb-6">
    <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-xs font-semibold text-text-secondary uppercase tracking-wider border-b border-border">
      <span>Thời gian</span>
      <span>Loại</span>
      <span>Họ tên</span>
      <span>CCCD</span>
      <span>Phòng</span>
      <span>Phương thức</span>
      <span>Nhân viên</span>
    </div>
    <div>
      @for (entry of entries; track entry.id) {
        <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-sm text-text-primary border-t border-[#F3F4F6] hover:bg-[#FAFBFC]">
          <span class="text-sm text-text-secondary">{{ entry.time }}</span>
          <span>
            <span class="badge" [class]="getTypeBadge(entry.type)">{{ getTypeLabel(entry.type) }}</span>
          </span>
          <span class="font-semibold">{{ entry.fullName }}</span>
          <span class="font-mono text-sm">{{ entry.cccd }}</span>
          <span class="font-semibold text-primary">{{ entry.room }}</span>
          <span>{{ entry.method }}</span>
          <span>{{ entry.staff }}</span>
        </div>
      }
    </div>
  </div>
</div>
