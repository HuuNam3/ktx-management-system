<div class="p-8 max-w-[1400px]">
  <app-page-header
    title="In giấy tờ & Tài liệu"
    description="Tạo và in giấy xác nhận"
    [showCheckin]="false" [showCheckout]="false" [showQR]="false"
  />

  <div class="grid grid-cols-[repeat(auto-fill,minmax(320px,1fr))] gap-5">
    @for (doc of documents; track doc.id) {
      <div class="bg-card-bg rounded-[var(--radius)] p-6 border border-border flex items-center gap-4 cursor-pointer transition-all duration-200 hover:-translate-y-[3px] hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] hover:border-[var(--card-color)] group" (click)="onClick(doc)" [style.--card-color]="doc.color" [style.--card-bg]="doc.bgColor">
        <div class="size-14 rounded-[16px] flex items-center justify-center shrink-0" [style.background]="doc.bgColor">
          <app-lucide-icon [name]="doc.icon" [size]="26" [color]="doc.color" />
        </div>
        <div class="flex-1">
          <h3 class="text-base font-semibold text-text-primary m-0 mb-1">{{ doc.title }}</h3>
          <p class="text-[13px] text-text-secondary m-0">{{ doc.description }}</p>
        </div>
        <div class="text-xl text-text-secondary shrink-0 transition-transform duration-200 group-hover:translate-x-1 group-hover:text-[var(--card-color)]">→</div>
      </div>
    }
  </div>
</div>
