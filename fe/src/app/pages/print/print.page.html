<div class="page">
  <app-page-header title="In giấy tờ & Tài liệu" description="Tạo và in các loại giấy tờ xác nhận" [showCheckin]="false" [showCheckout]="false" [showQR]="false" />

  <div class="grid grid-cols-3 gap-7 max-xl:grid-cols-2 max-md:grid-cols-1">
    @for (doc of documents; track doc.title) {
      <button class="flex min-h-[185px] flex-col items-center justify-center gap-6 rounded-2xl border border-gray-200 bg-white p-8 text-center hover:border-blue-300 hover:shadow-lg" (click)="open(doc)">
        <span class="flex size-[76px] items-center justify-center rounded-xl" [style.background]="doc.bg">
          <app-lucide-icon [name]="doc.icon" [size]="34" [color]="doc.color" />
        </span>
        <span class="text-xl font-bold">{{ doc.title }}</span>
      </button>
    }
  </div>

  @if (message) { <div class="fixed bottom-6 right-6 z-[300] rounded-xl bg-[#020214] px-5 py-3 text-sm font-bold text-white shadow-xl">{{ message }}</div> }

  @if (selectedDoc) {
    <div class="fixed inset-0 z-[280] flex items-center justify-center bg-slate-900/40 p-6" (click)="close()">
      <div class="grid max-h-[90vh] w-full max-w-[980px] grid-cols-[380px_1fr] overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl max-lg:grid-cols-1" (click)="$event.stopPropagation()">
        <div class="overflow-y-auto border-r border-gray-200 p-6 max-lg:border-r-0 max-lg:border-b">
          <div class="mb-5 flex items-start justify-between gap-4">
            <div>
              <h3 class="m-0 text-2xl font-black">{{ selectedDoc.title }}</h3>
              <p class="mt-2 text-slate-500">Nhập thông tin để tạo giấy tờ</p>
            </div>
            <button class="grid size-9 place-items-center rounded-lg border border-gray-200 bg-white" (click)="close()">
              <app-lucide-icon name="x" [size]="18" />
            </button>
          </div>

          <div class="grid gap-4">
            <label class="grid gap-2 text-sm font-bold">Họ tên
              <input class="h-11 rounded-xl border border-gray-200 bg-gray-50 px-4 font-normal outline-none" [(ngModel)]="printForm.fullName" />
            </label>
            <label class="grid gap-2 text-sm font-bold">CCCD/Mã SV
              <input class="h-11 rounded-xl border border-gray-200 bg-gray-50 px-4 font-normal outline-none" [(ngModel)]="printForm.cccd" />
            </label>
            <label class="grid gap-2 text-sm font-bold">Phòng
              <input class="h-11 rounded-xl border border-gray-200 bg-gray-50 px-4 font-normal outline-none" [(ngModel)]="printForm.room" />
            </label>
            <label class="grid gap-2 text-sm font-bold">Số tiền/Ghi chú phí
              <input class="h-11 rounded-xl border border-gray-200 bg-gray-50 px-4 font-normal outline-none" [(ngModel)]="printForm.amount" />
            </label>
            <label class="grid gap-2 text-sm font-bold">Nội dung
              <textarea class="min-h-[96px] resize-none rounded-xl border border-gray-200 bg-gray-50 p-4 font-normal outline-none" [(ngModel)]="printForm.note"></textarea>
            </label>
          </div>

          <div class="mt-6 flex flex-wrap gap-3">
            <button class="app-action-button-sm border border-gray-200 bg-white font-bold" (click)="downloadSelected()">Tải file</button>
            <button class="app-action-button-sm border-0 bg-[#020214] font-bold text-white" (click)="printSelected()">In giấy tờ</button>
          </div>
        </div>

        <div class="overflow-y-auto bg-gray-100 p-6">
          <div class="mx-auto min-h-[620px] max-w-[560px] whitespace-pre-line rounded bg-white p-10 font-serif text-[17px] leading-8 shadow">
            {{ previewText }}
          </div>
        </div>
      </div>
    </div>
  }
</div>
