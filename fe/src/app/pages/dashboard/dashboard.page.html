<div class="p-8 max-w-[1400px]">
  <app-page-header
    title="Tổng quan"
    description="Thống kê và hoạt động hệ thống KTX"
    [showCheckin]="false"
    [showCheckout]="false"
    [showQR]="false"
  />

  <div class="mb-6 grid gap-4 grid-cols-4 max-lg:grid-cols-2 max-sm:grid-cols-1">
      <app-statistic-card label="Tổng số khách" value="342" lucideIcon="users" subtitle="+12 hôm nay" subtitleIcon="trending-up" subtitleIconColor="#16A34A" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Số phòng trống" value="28/120" lucideIcon="bed" subtitle="23% còn trống" subtitleIcon="trending-down" subtitleIconColor="#DC2626" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Doanh thu hôm nay" value="12.5M" lucideIcon="dollar-sign" subtitle="+8.2% so với hôm qua" subtitleIcon="trending-up" subtitleIconColor="#16A34A" color="#F59E0B" bgColor="#FFFBEB" />
      <app-statistic-card label="Cảnh báo" value="8" lucideIcon="triangle-alert" subtitle="3 chưa đóng tiền" subtitleIcon="trending-up" subtitleIconColor="#16A34A" color="#DC2626" bgColor="#FEF2F2" />
    </div>

  <div class="mb-6 grid gap-6 grid-cols-[1.6fr_1fr] max-[1200px]:grid-cols-1">
    <div class="col-chart-main">
      <app-chart-card
        title="Doanh thu 7 ngày"
        description="Biểu đồ doanh thu"
        type="line"
        [data]="revenueData"
        [labels]="revenueLabels"
      />
    </div>
    <div class="col-chart-side">
      <app-chart-card
        title="Phân bố loại phòng"
        type="donut"
        [data]="distData"
        [labels]="distLabels"
        [colors]="distColors"
      />
    </div>
  </div>

  <div class="mb-6 grid gap-6 grid-cols-2 max-[1200px]:grid-cols-1">
    <div class="col-timeline">
      <app-timeline [items]="timelineItems" />
    </div>
    <div class="col-alerts">
      <app-alert-card [alerts]="alertItems" />
    </div>
  </div>
</div>
