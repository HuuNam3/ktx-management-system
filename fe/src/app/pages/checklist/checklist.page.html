<div class="page">
  <app-page-header title="Checklist Nhân viên" description="Danh sách công việc theo ca trực" [showCheckin]="false" [showCheckout]="false" [showQR]="false" />

  <div class="mb-[30px] grid grid-cols-3 gap-5 max-md:grid-cols-1">
    <div class="rounded-2xl border border-blue-200 bg-blue-50 px-[30px] py-8"><div class="text-blue-700">Ca hiện tại</div><div class="mt-4 text-[30px] font-bold text-blue-700">Ca sáng</div></div>
    <div class="rounded-2xl border border-green-200 bg-green-50 px-[30px] py-8"><div class="text-green-700">Đã hoàn thành</div><div class="mt-4 text-[30px] font-bold text-green-700">{{ completed }}/5</div></div>
    <div class="rounded-2xl border border-yellow-300 bg-yellow-50 px-[30px] py-8"><div class="text-yellow-700">Còn lại</div><div class="mt-4 text-[30px] font-bold text-yellow-700">{{ 5 - completed }}</div></div>
  </div>

  <div class="mb-[30px] rounded-2xl border border-gray-200 bg-white p-[30px]">
    <h3 class="m-0 mb-7 text-xl font-bold">Ca sáng (7:00 - 15:00)</h3>
    <div class="grid gap-5">
      @for (item of items; track item.task) {
        <button
          class="flex min-h-[96px] items-center gap-5 rounded-xl border px-5 text-left"
          [class.border-green-300]="item.done"
          [class.bg-green-50]="item.done"
          [class.border-transparent]="!item.done"
          [class.bg-gray-50]="!item.done"
          (click)="toggle(item)"
        >
          <span class="flex size-5 items-center justify-center rounded border border-gray-300" [class.bg-[#020214]]="item.done">
            @if (item.done) { <app-lucide-icon name="check" [size]="14" color="white" /> }
          </span>
          <span class="flex-1">
            <span class="block text-lg font-bold" [class.text-green-700]="item.done" [class.line-through]="item.done">{{ item.task }}</span>
            <span class="mt-1 block text-base text-slate-500">Thời gian: {{ item.time }}</span>
          </span>
          <span [class.text-green-600]="item.done" [class.text-slate-400]="!item.done">
            <app-lucide-icon [name]="item.done ? 'circle-check' : 'clock-3'" [size]="24" />
          </span>
        </button>
      }
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-[30px]">
    <h3 class="m-0 mb-7 text-xl font-bold">Ghi chú ca trực</h3>
    <textarea class="h-[76px] w-full resize-none rounded-xl border-0 bg-gray-100 p-4 text-base outline-none" placeholder="Ghi chú các sự việc phát sinh, vấn đề cần lưu ý..." [(ngModel)]="note"></textarea>
    <button class="app-action-button mt-5 border-0 bg-[#020214] font-bold text-white" (click)="saveNote()">Lưu ghi chú</button>
  </div>

  @if (message) { <div class="fixed bottom-6 right-6 z-[300] rounded-xl bg-[#020214] px-5 py-3 text-sm font-bold text-white shadow-xl">{{ message }}</div> }
</div>
