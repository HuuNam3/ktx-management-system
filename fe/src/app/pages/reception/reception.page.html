<div class="p-8 max-w-[1400px] max-md:p-4">
  <app-page-header
    title="Quầy Lễ Tân"
    description="Quản lý check-in/out nhanh chóng"
    (checkinClick)="onCheckin()"
    (checkoutClick)="onCheckout()"
    (qrClick)="onQr()"
  />

  <div class="mb-6 grid grid-cols-2 gap-6 max-[1200px]:grid-cols-1">
    <div class="flex">
      <app-search-card />
    </div>
    <div class="grid grid-cols-3 gap-4 max-md:grid-cols-1">
      <app-stat-card
        label="Check-in hôm nay"
        [value]="stats.checkinsToday | number"
        lucideIcon="log-in"
        color="var(--success)"
        bgColor="#F0FDF4"
      />
      <app-stat-card
        label="Check-out hôm nay"
        [value]="stats.checkoutsToday | number"
        lucideIcon="log-out"
        color="var(--danger)"
        bgColor="#FEF2F2"
      />
      <app-stat-card
        label="Đang ở"
        [value]="stats.currentOccupants | number"
        lucideIcon="circle"
        color="var(--primary)"
        bgColor="var(--primary-light)"
      />
    </div>
  </div>

  <div class="mb-6 grid grid-cols-1">
    <app-recent-checkin-list [items]="checkins" />
  </div>
</div>
