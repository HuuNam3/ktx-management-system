<div class="page">
  <app-page-header
    title="Quản lý Nhà thầu / Thợ"
    description="Check-in và theo dõi công việc"
    [showCheckin]="false" [showCheckout]="false" [showQR]="false"
  >
    <button class="btn btn-primary" (click)="onCheckin()"><app-lucide-icon name="plus" [size]="18" color="white" /> Check-in thợ</button>
  </app-page-header>

  @if (stats) {
    <div class="row stats-row stats-row-3">
      <app-statistic-card label="Đang làm việc" [value]="stats.working | number" lucideIcon="wrench" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Hoàn thành hôm nay" [value]="stats.completedToday | number" lucideIcon="check-circle" subtitle="" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Tổng lượt hôm nay" [value]="stats.totalToday | number" lucideIcon="bar-chart-3" subtitle="" color="#F59E0B" bgColor="#FFFBEB" />
    </div>
  }

  <div class="row table-card">
    <div class="table-hdr table-hdr-ct">
      <span>Họ tên</span>
      <span>Đơn vị</span>
      <span>Công việc</span>
      <span>Vị trí</span>
      <span>Check-in</span>
      <span>Check-out</span>
      <span>Trạng thái</span>
      <span>Thao tác</span>
    </div>
    <div class="table-bdy">
      @for (r of records; track r.id) {
        <div class="table-row table-row-ct">
          <span class="cell-name">{{ r.name }}</span>
          <span>{{ r.unit }}</span>
          <span>{{ r.job }}</span>
          <span>{{ r.location }}</span>
          <span>{{ r.checkin || '—' }}</span>
          <span>{{ r.checkout || '—' }}</span>
          <span><span class="badge" [class]="getStatusBadge(r.status)">{{ getStatusLabel(r.status) }}</span></span>
          <span>
            @if (r.status === 'dang-lam') {
              <button class="btn-icon-only" title="Check-out"><app-lucide-icon name="log-out" [size]="18" /></button>
            }
            <button class="btn-icon-only" title="Xem"><app-lucide-icon name="eye" [size]="18" /></button>
          </span>
        </div>
      }
    </div>
  </div>
</div>
