<div class="p-8 max-w-[1400px]">
  <app-page-header
    title="Quản lý Nhà thầu / Thợ"
    description="Check-in và theo dõi công việc"
    [showCheckin]="false" [showCheckout]="false" [showQR]="false"
  >
    <button class="btn btn-primary" (click)="onCheckin()"><app-lucide-icon name="plus" [size]="18" color="white" /> Check-in thợ</button>
  </app-page-header>

  @if (stats) {
    <div class="mb-6 grid gap-4 grid-cols-3">
      <app-statistic-card label="Đang làm việc" [value]="stats.working | number" lucideIcon="wrench" subtitle="" color="#2563EB" bgColor="#EFF6FF" />
      <app-statistic-card label="Hoàn thành hôm nay" [value]="stats.completedToday | number" lucideIcon="check-circle" subtitle="" color="#16A34A" bgColor="#F0FDF4" />
      <app-statistic-card label="Tổng lượt hôm nay" [value]="stats.totalToday | number" lucideIcon="bar-chart-3" subtitle="" color="#F59E0B" bgColor="#FFFBEB" />
    </div>
  }

  <div class="mb-6 bg-card-bg rounded-[20px] border border-border overflow-x-auto">
    <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-xs font-semibold text-text-secondary uppercase tracking-wider border-b border-border grid-cols-[1fr_1fr_1fr_80px_90px_90px_100px_70px]">
      <span>Họ tên</span>
      <span>Đơn vị</span>
      <span>Công việc</span>
      <span>Vị trí</span>
      <span>Check-in</span>
      <span>Check-out</span>
      <span>Trạng thái</span>
      <span>Thao tác</span>
    </div>
    <div class="table-bdy">
      @for (r of records; track r.id) {
        <div class="grid items-center px-6 py-[14px] gap-3 min-w-[700px] text-sm text-text-primary border-t border-[#F3F4F6] hover:bg-[#FAFBFC] grid-cols-[1fr_1fr_1fr_80px_90px_90px_100px_70px]">
          <span class="font-semibold">{{ r.name }}</span>
          <span>{{ r.unit }}</span>
          <span>{{ r.job }}</span>
          <span>{{ r.location }}</span>
          <span>{{ r.checkin || '—' }}</span>
          <span>{{ r.checkout || '—' }}</span>
          <span><span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap" [class]="getStatusBadge(r.status)">{{ getStatusLabel(r.status) }}</span></span>
          <span>
            @if (r.status === 'dang-lam') {
              <button class="size-9 rounded-[10px] border-none bg-transparent cursor-pointer inline-flex items-center justify-center text-lg transition-colors duration-200 hover:bg-bg" title="Check-out"><app-lucide-icon name="log-out" [size]="18" /></button>
            }
            <button class="size-9 rounded-[10px] border-none bg-transparent cursor-pointer inline-flex items-center justify-center text-lg transition-colors duration-200 hover:bg-bg" title="Xem"><app-lucide-icon name="eye" [size]="18" /></button>
          </span>
        </div>
      }
    </div>
  </div>
</div>
